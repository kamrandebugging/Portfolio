<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Kamran — Full-Stack Developer</title>
  <!--
    GitHub Pages serves this file for any path it doesn't recognize (a direct
    link or a hard refresh on /Portfolio/projects/labflow). It re-encodes the
    path into a query string and redirects to index.html, which decodes it
    back before React mounts (see the inline script in index.html).
    Technique: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    (function () {
      var basePath = '/Portfolio/';
      var path = location.pathname.slice(basePath.length);
      var search = location.search.replace(/^\?/, '');
      var redirect = basePath + '?redirect=' + encodeURIComponent(path) +
        (search ? '&' + search : '') + location.hash;
      location.replace(redirect);
    })();
  </script>
</head>
<body></body>
</html>
