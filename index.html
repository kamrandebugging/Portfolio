<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081c15" />
  <title>Muhammad Kamran — Full-Stack Developer</title>
  <meta name="description" content="I build real software, not demos — FBR-integrated invoicing (Laravel), LabFlow multi-tenant SaaS (Django + React). Open to internships + junior roles." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2352b788'/><text x='50%' y='56%' font-family='serif' font-weight='bold' font-size='44' fill='%23081c15' dominant-baseline='middle' text-anchor='middle'>MK</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script>
    // Synchronous pre-paint check: if the preloader was already seen in this session,
    // immediately hide it via CSS class to prevent any flash before DOM removal.
    try {
      if (sessionStorage.getItem('mk_preloader_seen')) {
        document.documentElement.classList.add('mk-preload-done');
      }
    } catch (e) {}
  </script>
  <style>
    html.mk-preload-done #mk-preloader {
      display: none !important;
    }
    #mk-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #081c15;
      color: #d8f3dc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #mk-preloader.mk-fading {
      opacity: 0;
      pointer-events: none;
    }
    .mk-stage-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      max-width: 640px;
      padding: 0 1.5rem;
      box-sizing: border-box;
    }
    .mk-word-stage,
    .mk-identity-stage {
      grid-area: 1 / 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }
    .mk-words-box {
      display: grid;
      place-items: center;
      width: 100%;
      height: clamp(3.5rem, 11vw, 6.5rem);
    }
    .mk-word {
      grid-area: 1 / 1;
      opacity: 0;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: clamp(5rem, 18vw, 16rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #d8f3dc;
      will-change: transform, opacity, filter;
      white-space: nowrap;
    }
    #mk-preloader.mk-running .mk-word {
      animation: mkWordCycle 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #mk-preloader.mk-running .mk-w-1 { animation-delay: 0s; }
    #mk-preloader.mk-running .mk-w-2 { animation-delay: 0.65s; }
    #mk-preloader.mk-running .mk-w-3 { animation-delay: 1.30s; }
    #mk-preloader.mk-running .mk-w-4 { animation-delay: 1.95s; }

    @keyframes mkWordCycle {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
        filter: blur(4px);
      }
      18% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
      82% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translateY(-20px) scale(0.97);
        filter: blur(4px);
      }
    }

    .mk-identity-stage {
      pointer-events: none;
    }
    .mk-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.12em, 1.8vw, 0.28em);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 9vw, 8rem);
      line-height: 1;
      letter-spacing: 0.2em;
      color: #d8f3dc;
      text-transform: uppercase;
    }
    .mk-char {
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    #mk-preloader.mk-running .mk-char {
      animation: mkLetterIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #mk-preloader.mk-running .mk-c-1 { animation-delay: 2.60s; }
    #mk-preloader.mk-running .mk-c-2 { animation-delay: 2.68s; }
    #mk-preloader.mk-running .mk-c-3 { animation-delay: 2.76s; }
    #mk-preloader.mk-running .mk-c-4 { animation-delay: 2.84s; }
    #mk-preloader.mk-running .mk-c-5 { animation-delay: 2.92s; }
    #mk-preloader.mk-running .mk-c-6 { animation-delay: 3.00s; }

    @keyframes mkLetterIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    .mk-rule {
      width: clamp(140px, 36vw, 240px);
      height: 1px;
      background-color: #52b788;
      margin: clamp(14px, 2.2vh, 20px) auto;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: center;
      will-change: transform, opacity;
    }
    #mk-preloader.mk-running .mk-rule {
      animation: mkRuleIn 0.50s cubic-bezier(0.16, 1, 0.3, 1) 3.05s forwards;
    }

    @keyframes mkRuleIn {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      100% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    .mk-sub {
      font-family: 'Share Tech Mono', ui-monospace, monospace;
      font-size: clamp(0.72rem, 2vw, 0.92rem);
      line-height: 1.4;
      letter-spacing: clamp(0.14em, 1.8vw, 0.22em);
      text-indent: clamp(0.14em, 1.8vw, 0.22em);
      color: #d8f3dc;
      opacity: 0;
      will-change: transform, opacity, filter;
      white-space: nowrap;
    }
    #mk-preloader.mk-running .mk-sub {
      animation: mkSubIn 0.50s cubic-bezier(0.16, 1, 0.3, 1) 3.15s forwards;
    }

    @keyframes mkSubIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(2px);
      }
      100% {
        opacity: 0.9;
        transform: translateY(0);
        filter: blur(0px);
      }
    }
  </style>
  <script>
    // Pairs with public/404.html: restores the real path (and any hash) that
    // GitHub Pages' 404 redirect encoded into ?redirect=... before React Router mounts.
    (function () {
      var params = new URLSearchParams(location.search);
      var redirect = params.get('redirect');
      if (redirect === null) return;
      params.delete('redirect');
      var rest = params.toString();
      var basePath = '/Portfolio/';
      var newUrl = basePath + redirect + (rest ? '?' + rest : '') + location.hash;
      history.replaceState(null, '', newUrl);
    })();
  </script>
</head>
<body>
  <div id="mk-preloader" aria-hidden="true">
    <div class="mk-stage-wrap">
      <div class="mk-word-stage">
        <div class="mk-words-box">
          <span class="mk-word mk-w-1">DESIGN</span>
          <span class="mk-word mk-w-2">BUILD</span>
          <span class="mk-word mk-w-3">TEST</span>
          <span class="mk-word mk-w-4">SHIP</span>
        </div>
      </div>
      <div class="mk-identity-stage">
        <div class="mk-name" aria-label="KAMRAN">
          <span class="mk-char mk-c-1">K</span>
          <span class="mk-char mk-c-2">A</span>
          <span class="mk-char mk-c-3">M</span>
          <span class="mk-char mk-c-4">R</span>
          <span class="mk-char mk-c-5">A</span>
          <span class="mk-char mk-c-6">N</span>
        </div>
        <div class="mk-rule"></div>
        <div class="mk-sub">Full-Stack Developer · 2026</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var preloader = document.getElementById('mk-preloader');
      if (!preloader) return;

      var isCleanedUp = false;
      function removePreloader() {
        if (isCleanedUp) return;
        isCleanedUp = true;
        try {
          document.body.style.overflow = '';
        } catch (e) {}
        try {
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        } catch (e) {}
        try {
          window.dispatchEvent(new Event('mk:preloader-done'));
        } catch (e) {}
      }

      try {
        // If already seen in this session: remove synchronously before first paint
        if (sessionStorage.getItem('mk_preloader_seen')) {
          removePreloader();
          return;
        }
      } catch (err) {
        removePreloader();
        return;
      }

      // First visit: lock body overflow and mark seen in sessionStorage
      try {
        document.body.style.overflow = 'hidden';
        sessionStorage.setItem('mk_preloader_seen', '1');
      } catch (err) {}

      // Hard failsafe: force-remove node after 7.5s no matter what
      var failsafeTimer = setTimeout(removePreloader, 7500);

      var sequenceStarted = false;
      function runSequence() {
        if (sequenceStarted || isCleanedUp) return;
        sequenceStarted = true;
        try {
          preloader.classList.add('mk-running');

          // Active sequence ~3.95s, then 600ms fade-out
          setTimeout(function () {
            if (isCleanedUp) return;
            preloader.classList.add('mk-fading');
          }, 3950);

          // Remove node completely from DOM after fade-out finishes
          setTimeout(function () {
            clearTimeout(failsafeTimer);
            removePreloader();
          }, 4600);
        } catch (err) {
          clearTimeout(failsafeTimer);
          removePreloader();
        }
      }

      try {
        // Wait for document.fonts.ready with 1500ms fallback timeout
        var fontTimeout = setTimeout(runSequence, 1500);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            clearTimeout(fontTimeout);
            runSequence();
          }).catch(function () {
            clearTimeout(fontTimeout);
            runSequence();
          });
        } else {
          clearTimeout(fontTimeout);
          runSequence();
        }
      } catch (err) {
        clearTimeout(failsafeTimer);
        removePreloader();
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
